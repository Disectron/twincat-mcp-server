name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Test
        run: python -m pytest -q -p anyio
      - name: Launcher dry run (no server start)
        run: python scripts/launch.py --src . --venv ${{ runner.temp }}/tcmcp-venv --no-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Claude Code plugin + marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Validate MCPB manifest
        run: |
          python -m pip install --quiet -e .
          python packaging/mcpb/build.py --out dist
