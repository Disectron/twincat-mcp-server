name: ci

on:
  push:
    branches: [main, "release/v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install --quiet -e ".[dev]"
      - name: Stand-in TcAdsDll.dll (Windows runner has no TwinCAT)
        if: runner.os == 'Windows'
        # pyads loads TcAdsDll.dll at import time and resolves it via <TWINCAT3DIR>\..\Common64. Any loadable
        # 64-bit DLL under that name lets the import succeed; the tests only use fake connections, and a real
        # ADS call against this stand-in fails with AttributeError (no such export) rather than reaching hardware.
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "tc"
          New-Item -ItemType Directory -Force (Join-Path $root "Common64") | Out-Null
          Copy-Item "$env:SystemRoot\System32\version.dll" (Join-Path $root "Common64\TcAdsDll.dll")
          $tcdir = Join-Path $root "3.1"
          "TWINCAT3DIR=$tcdir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8   # later steps
          $env:TWINCAT3DIR = $tcdir                                                             # this step
          python -c "import pyads, pyads.pyads_ex as x; print('pyads import ok via', x._adsDLL)"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error title=stand-in DLL::pyads still cannot import with TWINCAT3DIR=$tcdir"; exit 1 }
      - name: Build native capture service (Beckhoff AdsLib; Windows = TcAdsDll router mode)
        shell: bash
        run: |
          cmake -S native/capture -B build/capture -DCMAKE_BUILD_TYPE=Release
          cmake --build build/capture --config Release -j 4
          # GitHub runs bash with -e -o pipefail: `ls a b | head` fails when either path is missing, so test each
          exe=""
          for c in build/capture/tcmcp-capture build/capture/Release/tcmcp-capture.exe; do
            if [ -f "$c" ]; then exe="$c"; break; fi
          done
          if [ -z "$exe" ]; then echo "::error::tcmcp-capture was not built"; exit 1; fi
          "$exe" --version
          "$exe" --selftest
          p="$PWD/$exe"
          if command -v cygpath >/dev/null; then p=$(cygpath -w "$p"); fi
          echo "TCMCP_CAPTURE_EXE=$p" >> "$GITHUB_ENV"
      - name: Upload tcmcp-capture.exe
        if: runner.os == 'Windows' && matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: tcmcp-capture-windows-x64
          path: build/capture/Release/tcmcp-capture.exe
          if-no-files-found: error
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q -p anyio -rfE --tb=short --durations=10 2>&1 | tee pytest-output.txt
      - name: Report failures as annotations (log hosts are not reachable everywhere)
        if: failure()
        shell: python
        env:
          PYTHONUTF8: "1"            # the Windows console is cp1252; pytest output holds → — … and would kill this step
          PYTHONIOENCODING: utf-8
        run: |
          import os, re, sys
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          if not os.path.exists("pytest-output.txt"):
              print("::error title=ci::pytest did not run (an earlier step failed); see that step")
              raise SystemExit(0)
          text = open("pytest-output.txt", encoding="utf-8", errors="replace").read()
          summ = open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8")
          summ.write("## pytest (" + os.environ.get("RUNNER_OS", "?") + ")\n\n```\n" + text[-60000:] + "\n```\n")
          def ann(title, msg):
              msg = msg[:3800].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={title}::{msg}")
          m = re.search(r"=+ short test summary info =+\n(.*?)(?:\n=+ .* in [\d.]+s)", text, re.S)
          lines = [l for l in (m.group(1).splitlines() if m else []) if l.startswith(("FAILED", "ERROR"))]
          for l in lines[:8]:
              ann("pytest", l)
          # first two failure sections, verbatim, for a traceback
          secs = re.split(r"\n_{5,} (.*?) _{5,}\n", text)
          for name, body in list(zip(secs[1::2], secs[2::2]))[:2]:
              ann(f"traceback {name}", body)
          if not lines:
              ann("pytest", text[-3800:])
      - name: Launcher dry run (no server start)
        if: ${{ !cancelled() }}
        run: python scripts/launch.py --src . --venv ${{ runner.temp }}/tcmcp-venv --no-run
      - name: launch.cmd Python discovery (the .mcpb entry point)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: cmd
        run: |
          set TCMCP_PYTHON=
          scripts\launch.cmd --src . --venv %RUNNER_TEMP%\tcmcp-venv-cmd --no-run
          if errorlevel 1 exit /b 1
          echo --- and via TCMCP_PYTHON pointing at a bogus interpreter (must fall back, not die)
          set TCMCP_PYTHON=C:\nonexistent\python.exe
          scripts\launch.cmd --src . --venv %RUNNER_TEMP%\tcmcp-venv-cmd --no-run

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate Claude Code plugin + marketplace
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: Validate MCPB manifest
        run: |
          python -m pip install --quiet -e .
          python packaging/mcpb/build.py --out dist
